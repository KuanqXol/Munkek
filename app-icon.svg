<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="sponge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cherry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#431407" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  
  <g filter="url(#shadow)">
    <!-- Plate / Base -->
    <ellipse cx="256" cy="400" rx="160" ry="24" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="256" cy="396" rx="140" ry="16" fill="#f5f5f4"/>

    <!-- Cake Base Tier -->
    <!-- Bottom layer sponge -->
    <path d="M 140 280 L 140 370 C 140 395 372 395 372 370 L 372 280 Z" fill="url(#sponge)"/>
    
    <!-- Frosting filling line -->
    <path d="M 140 325 C 180 340 332 340 372 325 L 372 338 C 332 353 180 353 140 338 Z" fill="url(#frosting)"/>

    <!-- Top dripping frosting -->
    <path d="M 140 280 
             C 140 305 372 305 372 280 
             L 372 250 
             C 372 230 140 230 140 250 Z" fill="url(#frosting)"/>
             
    <!-- Frosting drips -->
    <path d="M 140 270 
             C 155 295 165 295 175 270
             C 185 305 200 305 210 270
             C 225 310 240 310 255 270
             C 270 300 285 300 295 270
             C 310 310 325 310 335 270
             C 350 295 360 295 372 270
             L 372 250 C 372 230 140 230 140 250 Z" fill="url(#frosting)"/>

    <!-- Candles -->
    <!-- Center Candle -->
    <rect x="247" y="150" width="18" height="85" rx="5" fill="#38bdf8"/>
    <path d="M 247 170 L 265 180 L 265 190 L 247 180 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M 247 200 L 265 210 L 265 220 L 247 210 Z" fill="#ffffff" opacity="0.6"/>
    <!-- Wick -->
    <line x1="256" y1="150" x2="256" y2="138" stroke="#78716c" stroke-width="3"/>
    <!-- Flame -->
    <path d="M 256 105 C 242 125 246 138 256 138 C 266 138 270 125 256 105 Z" fill="#fbbf24"/>
    <path d="M 256 115 C 248 128 250 136 256 136 C 262 136 264 128 256 115 Z" fill="#f97316"/>

    <!-- Cherries on sides -->
    <circle cx="190" cy="245" r="18" fill="url(#cherry)"/>
    <path d="M 190 230 Q 180 200 170 195" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <circle cx="322" cy="245" r="18" fill="url(#cherry)"/>
    <path d="M 322 230 Q 332 200 342 195" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
